name: Update README Game Plan

on:
  push:
    branches:
      - main
    paths:
      - AGENTS.md
      - PROJECT_STATUS.md
      - NEXT_STEPS.md
      - scripts/update-readme.mjs
      - README.md
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Refresh README game plan block
        run: node scripts/update-readme.mjs

      - name: Commit README update
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: auto-update README game plan"
          file_pattern: README.md
