name: Apply Pickaxe V3.1 Candidate Sync

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-v31-candidate-sync.yml"

permissions:
  contents: write

jobs:
  wire-v31-candidate-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Wire V3.1 candidate sync into public/index.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          index = Path('public/index.html')
          text = index.read_text()

          css_anchor = '    <link rel="stylesheet" href="pickaxe-v31-watchlist-queue.css?v=v3-1-patch4-20260616" />'
          css_line = '    <link rel="stylesheet" href="pickaxe-v31-candidate-sync.css?v=v3-1-patch5-20260616" />'
          js_anchor = '    <script src="pickaxe-v31-watchlist-queue.js?v=v3-1-patch4-20260616"></script>'
          js_line = '    <script src="pickaxe-v31-candidate-sync.js?v=v3-1-patch5-20260616"></script>'

          if css_line not in text:
            if css_anchor not in text:
              raise SystemExit('V3.1 watchlist CSS anchor not found')
            text = text.replace(css_anchor, css_anchor + '\n' + css_line, 1)

          if js_line not in text:
            if js_anchor not in text:
              raise SystemExit('V3.1 watchlist JS anchor not found')
            text = text.replace(js_anchor, js_anchor + '\n' + js_line, 1)

          index.write_text(text)
          PY

      - name: Commit V3.1 candidate sync wiring if changed
        run: |
          if git diff --quiet -- public/index.html; then
            echo "No candidate sync wiring changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          git commit -m "Wire Pickaxe V3.1 candidate sync"
          git push
