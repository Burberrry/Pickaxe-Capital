<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="refresh" content="0; url=../../#/alerts">
    <meta name="robots" content="noindex">
    <title>Pickaxe Capital | Opening Alerts Desk</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #050607;
        color: #f6f0e4;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        background:
          radial-gradient(circle at 50% 0%, rgba(212, 175, 55, 0.14), transparent 34%),
          linear-gradient(180deg, #0b0c0e, #030405);
      }

      main {
        width: min(100%, 560px);
        padding: clamp(24px, 6vw, 48px);
        box-sizing: border-box;
        border: 1px solid rgba(212, 175, 55, 0.3);
        border-radius: 24px;
        background: rgba(10, 11, 13, 0.92);
        box-shadow: 0 28px 90px rgba(0, 0, 0, 0.5);
        text-align: center;
      }

      p {
        color: rgba(246, 240, 228, 0.72);
        line-height: 1.6;
      }

      .kicker {
        color: #d4af37;
        font-size: 0.75rem;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        margin: 12px 0;
        font-size: clamp(2rem, 8vw, 4rem);
        line-height: 0.95;
      }

      a {
        display: inline-flex;
        min-height: 46px;
        align-items: center;
        justify-content: center;
        margin-top: 12px;
        padding: 0 20px;
        border: 1px solid rgba(212, 175, 55, 0.55);
        border-radius: 999px;
        color: #f6f0e4;
        text-decoration: none;
      }

      a:focus-visible {
        outline: 3px solid rgba(212, 175, 55, 0.5);
        outline-offset: 3px;
      }
    </style>
    <script>
      const destination = new URL("../../", window.location.href);
      destination.search = window.location.search;
      destination.hash = "#/alerts";
      window.location.replace(destination.href);
    </script>
  </head>
  <body>
    <main>
      <p class="kicker">Pickaxe Capital / AI Habitat OS</p>
      <h1>Opening Alerts Desk…</h1>
      <p>Research only. CEO B manual review required. No broker execution. Public output remains blocked.</p>
      <a href="../../#/alerts">Open the canonical Alerts Desk</a>
    </main>
  </body>
</html>
